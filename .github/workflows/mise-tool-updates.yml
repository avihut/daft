name: mise tool updates

# Daily job that runs `mise upgrade --bump` to advance tool versions in
# mise.toml and mise.lock, then opens a PR if anything changed.
# The 7-day cooldown in mise.toml's [settings] minimum_release_age means this
# only ever picks versions that have aged past the gate — no fresh releases
# enter without intent. `--bump` does not bypass that gate.
on:
  schedule:
    # Daily 06:00 UTC (= 09:00 Asia/Jerusalem) — matches the Dependabot
    # schedule. Most days this is a no-op (nothing has aged into the gate);
    # the action only opens a PR when there's an actual diff.
    - cron: "0 6 * * *"
  workflow_dispatch: # manual trigger from the Actions UI
    inputs:
      bypass_cooldown:
        description:
          "Ignore the 7d minimum_release_age (pick the newest available version,
          including fresh releases)"
        type: boolean
        default: false

# The branch push and the PR are made with the Wheatley App token, not
# GITHUB_TOKEN: PRs opened by GITHUB_TOKEN trigger no workflows, so the PR
# would sit with no CI and could never satisfy the `ci-gate` required check
# without someone closing and reopening it. With the App token the PR gets the
# same CI run as any other. GITHUB_TOKEN therefore needs nothing beyond the
# checkout.
permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WHEATLEY_BOT_APP_ID }}
          private-key: ${{ secrets.WHEATLEY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run mise upgrade
        # `--bump` advances the pin in mise.toml itself, keeping whatever
        # precision was there (`2.1.6` → `2.1.10`, `1.3` → `1.4`).
        #
        # It is load-bearing, not a convenience. Bare `mise upgrade` stays
        # inside the constraint already declared in mise.toml, and an exact pin
        # admits exactly one version — so from #498 (which pinned every tool to
        # stop CI flake) this job became a guaranteed no-op: green every day,
        # zero PRs for ~2.5 months, five tools silently stale. See #803.
        # Do not drop `--bump` without also unpinning the tools.
        #
        # Two tools stay out of the automated bump:
        #   rust   — `--bump` keeps precision, so `1.95` → `1.96`, which is an
        #            MSRV change. MSRV is `latest_stable - 2`, mirrored across
        #            six files, and needs human triage for clippy-lint
        #            escalations and transitive-dep conflicts;
        #            msrv-staleness-check.yml owns that bump. Plain upgrade
        #            still carries 1.95.x patches, which is what we want here.
        #   neovim — the vfox backend records no concrete version in mise.lock;
        #            mise.toml keeps the "stable" tag selector deliberately.
        #
        # The cooldown override is a CLI flag, never an `env:` entry, and the
        # xtask `mise_upgrade_drift` test holds that. An Actions `env:` value
        # is always *set*: the false branch of a `${{ ... && ... || '' }}`
        # expression exports the variable as the empty string rather than
        # omitting it. mise cannot parse "" as a duration, WARNs instead of
        # erroring, and resolves no version list for any tool — so `--bump`
        # finds nothing to bump and the job goes green having done nothing.
        # That is #926: zero PRs from 2026-05-10 (#489) to 2026-09-04, which
        # also meant #804's `--bump` fix never took effect. An unset variable
        # is what falls through to mise.toml's `[settings] minimum_release_age`
        # — and leaving it unset is why the 7d default is not duplicated here.
        run:
          mise upgrade --bump --exclude rust --exclude neovim ${{
          inputs.bypass_cooldown && '--minimum-release-age 0' || '' }}

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "deps: bump mise tools"
          title:
            "${{ inputs.bypass_cooldown && 'deps: bump mise tools (cooldown
            bypassed)' || 'deps: bump mise tools' }}"
          body: |
            Automated `mise upgrade` run.

            ${{ inputs.bypass_cooldown && '**Cooldown bypassed.** Triggered manually with `bypass_cooldown=true` — `--minimum-release-age 0` was passed for this run, so the 7-day cooldown in `mise.toml` was disabled and the newest available versions (including fresh releases) were picked.' || 'Versions selected are subject to the 7-day cooldown set in `mise.toml` `[settings] minimum_release_age = "7d"`.' }}

            Runs `mise upgrade --bump`, so the pins in `mise.toml` advance too,
            not just `mise.lock`. `rust` and `neovim` are excluded on purpose:
            bumping `rust` is an MSRV change (owned by
            `msrv-staleness-check.yml`), and `neovim` deliberately tracks the
            `stable` tag.

            Opened with the Wheatley App token so CI runs on it like any other
            PR. Not auto-merged: that is reserved for Dependabot's PRs — review,
            then squash-merge once `ci-gate` is green.
          branch: deps/mise-auto-upgrade
          delete-branch: true
          labels: |
            dependencies
