name: mise tool updates

# Daily job that runs `mise upgrade --bump` to advance tool versions in
# mise.toml and mise.lock, then opens a PR if anything changed.
# The 7-day cooldown in mise.toml's [settings] minimum_release_age means this
# only ever picks versions that have aged past the gate — no fresh releases
# enter without intent. `--bump` does not bypass that gate.
on:
  schedule:
    # Daily 06:00 UTC (= 09:00 Asia/Jerusalem) — matches the Dependabot
    # schedule. Most days this is a no-op (nothing has aged into the gate);
    # the action only opens a PR when there's an actual diff.
    - cron: "0 6 * * *"
  workflow_dispatch: # manual trigger from the Actions UI
    inputs:
      bypass_cooldown:
        description:
          "Ignore the 7d minimum_release_age (pick the newest available version,
          including fresh releases)"
        type: boolean
        default: false

# The branch push and the PR are made with the Wheatley App token, not
# GITHUB_TOKEN: PRs opened by GITHUB_TOKEN trigger no workflows, so the PR
# would sit with no CI and could never satisfy the `ci-gate` required check
# without someone closing and reopening it. With the App token the PR gets the
# same CI run as any other. GITHUB_TOKEN therefore needs nothing beyond the
# checkout.
permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WHEATLEY_BOT_APP_ID }}
          private-key: ${{ secrets.WHEATLEY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run mise upgrade
        # `--bump` advances the pin in mise.toml itself, keeping whatever
        # precision was there (`2.1.6` → `2.1.10`, `1.3` → `1.4`).
        #
        # It is load-bearing, not a convenience. Bare `mise upgrade` stays
        # inside the constraint already declared in mise.toml, and an exact pin
        # admits exactly one version — so from #498 (which pinned every tool to
        # stop CI flake) this job became a guaranteed no-op: green every day,
        # zero PRs for ~2.5 months, five tools silently stale. See #803.
        # Do not drop `--bump` without also unpinning the tools.
        #
        # Two tools stay out of the automated bump:
        #   rust   — `--bump` keeps precision, so `1.95` → `1.96`, which is an
        #            MSRV change. MSRV is `latest_stable - 2`, mirrored across
        #            six files, and needs human triage for clippy-lint
        #            escalations and transitive-dep conflicts;
        #            msrv-staleness-check.yml owns that bump. Plain upgrade
        #            still carries 1.95.x patches, which is what we want here.
        #   neovim — the vfox backend records no concrete version in mise.lock;
        #            mise.toml keeps the "stable" tag selector deliberately.
        #
        # The cooldown override is a CLI flag, never an `env:` entry, and the
        # xtask `mise_upgrade_drift` test holds that. An Actions `env:` value
        # is always *set*: the false branch of a `${{ ... && ... || '' }}`
        # expression exports the variable as the empty string rather than
        # omitting it. mise cannot parse "" as a duration, WARNs instead of
        # erroring, and resolves no version list for any tool — so `--bump`
        # finds nothing to bump and the job goes green having done nothing.
        # That is #926: zero PRs from 2026-05-10 (#489) to 2026-09-04, which
        # also meant #804's `--bump` fix never took effect. An unset variable
        # is what falls through to mise.toml's `[settings] minimum_release_age`
        # — and leaving it unset is why the 7d default is not duplicated here.
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/mise-upgrade.log"
          mise upgrade --bump --exclude rust --exclude neovim \
            ${{ inputs.bypass_cooldown && '--minimum-release-age 0' || '' }} \
            2>&1 | tee "$log"

          # mise WARNs rather than errors when it cannot resolve a tool's
          # version list, and a run that resolved nothing looks exactly like a
          # run that had nothing to do: both are green in fifteen seconds and
          # open no PR. That is how #926 stayed invisible for four months, and
          # how #803's no-op stayed invisible before it. Fail loudly instead.
          #
          # Match this one sentinel, not WARNs in general — "newer <tool>
          # release X ignored by minimum_release_age" is also a WARN, and it is
          # the cooldown working as intended on a perfectly healthy run.
          #
          # Upstream wording is a dependency here: if mise rephrases the
          # message this guard goes quiet again, so a run that is suspiciously
          # fast and opens no PR still deserves a look at the log.
          if grep -q 'Failed to resolve tool version list' "$log"; then
            echo "::error::mise resolved no version lists — the upgrade was a \
          no-op, not an up-to-date day (see #926)."
            exit 1
          fi

      # Classify the bump while the working tree still holds the diff — after
      # `Open PR` the action has reset the checkout, and the evidence is gone.
      #
      # mise prints its own summary, which is the signal:
      #
      #   Upgraded 6 tools:
      #     aqua:cargo-bins/cargo-binstall 1.18.1 → 1.22.0
      #     lefthook 2.1.6 → 2.1.11
      #
      # Auto-merge is for the boring case only: every tool stayed inside its
      # major. That is the same line dependabot-auto-merge.yml draws, for the
      # same reason — green CI is necessary but not sufficient for a major
      # (tera 2.0 gutted its built-in filters behind a green build; shlex 2.0
      # changed its API).
      #
      # Green is *weaker* evidence here than it is for a Dependabot PR, and the
      # comment should say so rather than imply parity. A mise-only diff
      # matches test.yml's `rust` path class but not `docs` or `lockfile`, so
      # docs-build, docs-golden and dep-age-check all skip — and docs-build
      # pins its own node/bun through setup-node/setup-bun, never mise's. So
      # mise's bun and node are exercised by nothing in CI, ever. Two things
      # bound that: the blast radius for bun/lefthook/bat is local development
      # (the workflows and the deploy use their own pins), and a node *major*
      # is self-blocking — it stops matching the workflows, `node_version_parity`
      # reddens xtask-test, and ci-gate never goes green (#931).
      #
      # Every branch below fails *closed*, because the dangerous mistake is
      # reading "no bumps found" as "no majors found". A missing summary, an
      # upstream rewording, an unparseable version, or a count that disagrees
      # with the pins that actually moved in mise.toml all decline. The count
      # cross-check is what keeps that true if mise ever rewords the summary —
      # the same upstream-wording dependency the no-op guard above carries.
      - name: Classify the bump
        id: bump
        run: |
          set -euo pipefail

          decline() {
            echo "automerge=false" >>"$GITHUB_OUTPUT"
            echo "::notice::not arming auto-merge: $1"
            exit 0
          }

          log="$RUNNER_TEMP/mise-upgrade.log"
          [ -f "$log" ] || decline "no upgrade log at $log"

          # mise colourises even through a pipe on CI; strip escapes first.
          plain=$(sed -E $'s/\033\[[0-9;]*[A-Za-z]//g' "$log")

          declared=$(printf '%s\n' "$plain" |
            sed -nE 's/^Upgraded ([0-9]+) tools?:.*$/\1/p' | tail -1)
          [ -n "${declared:-}" ] ||
            decline "no 'Upgraded N tools:' summary — did mise reword it?"
          [ "$declared" -gt 0 ] || decline "the summary declares zero tools"

          bumps=$(printf '%s\n' "$plain" |
            sed -nE 's/^[[:space:]]+([^[:space:]]+) ([^[:space:]]+) (→|->) ([^[:space:]]+)[[:space:]]*$/\1 \2 \4/p')
          parsed=$(printf '%s' "$bumps" | grep -c . || true)
          [ "$parsed" -eq "$declared" ] ||
            decline "parsed $parsed bump line(s), summary declares $declared"

          # The summary is mise's prose; this is the change actually being
          # merged. If they disagree, trust neither.
          # Count added *pin* lines only (they start with a bare name or a
          # quoted backend spec). A blanket '^\+[^+]' would also count a
          # comment or a [settings] line the bump happened to touch, inflating
          # the count and declining a legitimate all-minor run — fails closed,
          # but as a mystery refusal.
          moved=$(git diff --unified=0 -- mise.toml | grep -cE '^\+[A-Za-z"]' || true)
          [ "$moved" -eq "$declared" ] ||
            decline "$moved pin(s) moved in mise.toml, summary declares $declared"

          held=true
          while read -r tool from to; do
            [ -n "$tool" ] || continue
            from_major=${from%%.*}
            to_major=${to%%.*}
            if ! printf '%s' "$from_major" | grep -qE '^[0-9]+$' ||
              ! printf '%s' "$to_major" | grep -qE '^[0-9]+$'; then
              echo "  $tool $from -> $to: no numeric major to compare"
              held=false
            elif [ "$from_major" != "$to_major" ]; then
              echo "  $tool $from -> $to: major $from_major -> $to_major"
              held=false
            fi
          done <<<"$bumps"

          if [ "$held" = true ]; then
            echo "automerge=true" >>"$GITHUB_OUTPUT"
            echo "::notice::$declared tool(s) bumped, every major unchanged — arming auto-merge"
          else
            decline "a major changed (listed above); this one is for a human"
          fi

      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "deps: bump mise tools"
          title:
            "${{ inputs.bypass_cooldown && 'deps: bump mise tools (cooldown
            bypassed)' || 'deps: bump mise tools' }}"
          body: |
            Automated `mise upgrade` run.

            ${{ inputs.bypass_cooldown && '**Cooldown bypassed.** Triggered manually with `bypass_cooldown=true` — `--minimum-release-age 0` was passed for this run, so the 7-day cooldown in `mise.toml` was disabled and the newest available versions (including fresh releases) were picked.' || 'Versions selected are subject to the 7-day cooldown set in `mise.toml` `[settings] minimum_release_age = "7d"`.' }}

            Runs `mise upgrade --bump`, so the pins in `mise.toml` advance too,
            not just `mise.lock`. `rust` and `neovim` are excluded on purpose:
            bumping `rust` is an MSRV change (owned by
            `msrv-staleness-check.yml`), and `neovim` deliberately tracks the
            `stable` tag.

            Opened with the Wheatley App token so CI runs on it like any other
            PR. Auto-merge is armed only when every tool stayed inside its
            major; a major bump waits for a human, and the job's log says which
            branch it took. Either way GitHub merges nothing until `ci-gate` is green.
          branch: deps/mise-auto-upgrade
          delete-branch: true
          labels: |
            dependencies

      # Fail closed, the same probe dependabot-auto-merge.yml runs and for the
      # same reason: auto-merge is only safe because the master ruleset refuses
      # to merge until `ci-gate` passes. If that rule is ever removed, arming
      # auto-merge would merge this PR on no checks at all. The branch-rules
      # endpoint reports the rules in force for the target branch.
      #
      # Armed with the App token, not GITHUB_TOKEN, for the same reason the PR
      # is opened with it: a GITHUB_TOKEN-driven merge triggers no downstream
      # workflows. Verified 2026-09-04 — the two Dependabot PRs that
      # auto-merged that day (afd9c496, 6ef04345) have no release-flow.yml run,
      # while every commit merged by hand around them does. That is harmless
      # for `deps:` commits, which cliff.toml maps to no version bump, and it
      # self-heals on the next push to master, but there is no reason to
      # inherit it here.
      #
      # If this step ever 403s on the rules probe, the App is missing
      # `administration: read` — grant it rather than dropping the probe.
      - name: Enable auto-merge (squash)
        if:
          steps.bump.outputs.automerge == 'true' &&
          steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          rules=$(gh api "repos/${GH_REPO}/rules/branches/${BASE_REF}")
          if ! echo "$rules" | jq -e '
              [ .[] | select(.type == "required_status_checks")
                    | .parameters.required_status_checks[]? | .context ]
              | index("ci-gate") != null' >/dev/null; then
            echo "::error::ci-gate is not a required status check on ${BASE_REF}; refusing to enable auto-merge. Restore the master ruleset (.github/rulesets/master.json)."
            exit 1
          fi
          echo "ci-gate is required on ${BASE_REF}"

          # Idempotent: this job re-runs daily against the same branch, so the
          # PR may already be armed from yesterday's run.
          state=$(gh pr view "$PR" --json autoMergeRequest,mergeStateStatus)
          if [ "$(echo "$state" | jq -r '.autoMergeRequest != null')" = "true" ]; then
            echo "auto-merge already enabled"
            exit 0
          fi
          if [ "$(echo "$state" | jq -r '.mergeStateStatus')" = "CLEAN" ]; then
            echo "PR is already mergeable; merging (squash)"
            gh pr merge --squash "$PR"
            exit 0
          fi
          gh pr merge --auto --squash "$PR"
          echo "auto-merge enabled (squash); GitHub merges when ci-gate is green"
