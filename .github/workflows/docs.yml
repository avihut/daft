name: Deploy Docs

on:
  # Deploy on release tags only, so the published site describes the released
  # binary rather than master. Deploying on every master push meant a user who
  # installed the latest tag read documentation for merged-but-unreleased
  # commands — with the nav's version indicator (parsed from Cargo.toml, which
  # only the release PR bumps) rendering the *released* version right beside
  # them.
  #
  # LOAD-BEARING: this fires only because release-flow.yml pushes the tag with
  # the Wheatley GitHub App token. Refs pushed with the default GITHUB_TOKEN do
  # not trigger workflows, so switching that job back to GITHUB_TOKEN would
  # silently strand the docs site at the last App-token-tagged release — green
  # runs, no deploys, no signal. release.yml triggers on this same tag push, so
  # the two fail and recover together.
  #
  # No paths: filter here on purpose. A release republishes regardless of its
  # diff shape (CHANGELOG.md is @include'd into docs/about/changelog.md but
  # would not match a docs/** filter), and path filters are unreliable against
  # tag pushes.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Pull requests are NOT a trigger here. The PR-time checks — the VitePress
# build and the diagram language's golden suite — live in test.yml as the
# `docs-build` and `docs-golden` jobs, gated per job by its `changes` filter,
# so they feed the `ci-gate` required check. A path-filtered workflow cannot
# be a required check: when the filter does not match, its checks never report
# and the PR can never merge. Keep this file deploy-only.

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # wrangler-action installs `wrangler@4` via bun and then verifies it with
      # `bun run wrangler --version`. That verification shells out to system
      # Node, and wrangler 4 requires Node ≥ 22 — but ubuntu-latest still ships
      # Node 20.x as the default. Without this step the deploy fails with
      # "Wrangler requires at least Node.js v22.0.0".
      #
      # The major tracks `mise.toml`'s node pin, and `cargo test --package
      # xtask` (`node_version_parity`) fails if it stops doing so — the daily
      # tool-upgrade job moves that pin on its own, and the resulting skew is
      # invisible here otherwise (#931). Node 26 is Current until 2026-10-28
      # and Active LTS after, EOL 2029-04-30; that is a year more runway than
      # the 24 this replaced, which drops to Maintenance on 2026-10-20.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: bunx vitepress build

      # Release-tag pushes and manual dispatch are the only triggers, so this
      # always deploys; the guard is belt and braces against a PR trigger being
      # re-added above without a second look. github.event_name is a trusted,
      # GitHub-controlled value (no untrusted-input injection).
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command:
            pages deploy docs/.vitepress/dist --project-name avihu-daft --branch
            main
