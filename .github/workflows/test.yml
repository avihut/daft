name: Test Git Worktree Workflow

# This workflow is what "green" means for a pull request: its `ci-gate` job is
# the one status check the `master` ruleset requires, and it fans in every
# other job here. Two things follow from that:
#
#  - There is deliberately NO workflow-level `paths:` filter. A filtered-out
#    workflow never starts, so its checks stay "Expected" forever and the PR
#    can never merge (a docs-only PR, say). Path gating happens per job
#    through the `changes` job below: a job skipped by `if:` is reported as
#    skipped, which a required check treats as passing. Keep it that way —
#    `changes` plus `if:` is the only form of path gating this file may use.
#
#  - Every job must be listed in `ci-gate`'s `needs:`. A job left out is a
#    job that can fail without blocking the merge. `cargo test --package xtask`
#    (the `ci_gate_needs_every_job` test) fails when the two drift apart.
#
# CLAUDE.md "Quality Gates: CI <-> Merge-Gate Parity" owns the rest: every job
# here mirrors a `mise run` task and a `pre-merge` ring in daft.yml.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which kinds of files changed in this PR. Each downstream job
  # gates on these outputs so we only spin up runners when relevant. Any
  # change to test.yml itself sets `self=true`, which OR's into every
  # other gate, so editing the workflow re-validates the whole suite.
  # Skipped jobs consume zero CI minutes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      self: ${{ steps.detect.outputs.self }}
      rust: ${{ steps.detect.outputs.rust }}
      tests: ${{ steps.detect.outputs.tests }}
      xtask: ${{ steps.detect.outputs.xtask }}
      man: ${{ steps.detect.outputs.man }}
      lockfile: ${{ steps.detect.outputs.lockfile }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          echo "Changed files in this PR:"
          echo "$files"
          echo "---"

          self=false
          rust=false
          tests=false
          xtask=false
          man=false
          lockfile=false
          docs=false

          if echo "$files" | grep -qxE '\.github/workflows/test\.yml'; then
            self=true
          fi
          if echo "$files" | grep -qE '^(src/|Cargo\.(toml|lock)|mise\.(toml|lock)|lefthook\.yml)'; then
            rust=true
          fi
          if echo "$files" | grep -qE '^(tests/|scripts/|mise-tasks/setup/)'; then
            tests=true
          fi
          # `xtask` also gates the drift tests, so it must watch every file
          # they read: the shared symlink farm and the install manifests that
          # keep their own copy of it (#903). A PR touching only one of those
          # would otherwise run no job at all, leaving the gate that exists
          # for exactly that edit unexecuted.
          if echo "$files" | grep -qE '^(xtask/|mise-tasks/setup/_rust_symlink_lib\.sh|dist-workspace\.toml|flake\.nix|packaging/)'; then
            xtask=true
          fi
          if echo "$files" | grep -qE '^(man/|docs/cli/)'; then
            man=true
          fi
          if echo "$files" | grep -qxE '(Cargo\.lock|bun\.lock|docs/bun\.lock|\.dep-age-allowlist|cooldown\.toml|bunfig\.toml|deny\.toml)'; then
            lockfile=true
          fi
          # The docs site: its sources, the mise tasks that build it, and
          # Cargo.toml (the nav's version indicator is parsed from it).
          if echo "$files" | grep -qE '^(docs/|mise-tasks/docs/|Cargo\.toml$)'; then
            docs=true
          fi

          for k in self rust tests xtask man lockfile docs; do
            echo "$k=${!k}" | tee -a "$GITHUB_OUTPUT"
          done

  # Supply-chain gate: refuse PRs that introduce dep-lock entries younger than
  # 7 days (Cargo.lock + bun.lock). Bypass via .dep-age-allowlist (with
  # rationale) or commit env ALLOW_FRESH_DEPS=1 in an emergency.
  dep-age-check:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.lockfile ==
      'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check lockfile freshness
        env:
          # github.base_ref is a refname (cannot contain shell metacharacters
          # per git ref-format rules); we still funnel it through env to avoid
          # interpolating it into the shell command directly.
          PR_BASE_REF: ${{ github.base_ref }}
        run: BASE_REF="origin/${PR_BASE_REF}" scripts/check-lockfile-age.sh

  # Config gate: release.yml is generated by `dist generate`, which drops the
  # manually maintained DAFT_BUILD_RELEASE env block when re-run. Without it,
  # release binaries build with the daft_dev_build cfg and honor DAFT_*_DIR
  # redirects (#669). Unconditional (no `changes` gating): the dangerous PR —
  # a regenerated release.yml — touches no path the filters watch.
  release-env-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release workflow builds with DAFT_BUILD_RELEASE
        run: scripts/check-release-build-env.sh

  # Supply-chain gate: every `uses:` in .github/workflows/ is pinned to a full
  # commit SHA (tags are mutable; Dependabot keeps SHA pins current, which is
  # what makes auto-merging its actions bumps reasonable). Unconditional, like
  # release-env-guard, and for the same reason: the PR that regenerates
  # release.yml with tag refs touches no path the filters watch. The
  # repository setting "Require actions to be pinned to a full-length commit
  # SHA" is the second line — it refuses to *run* an unpinned workflow, which
  # would otherwise surface as a silently broken release. Mirrored by
  # `mise run validate:actions-pinned` and the `actions-pinned` ring.
  actions-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every action is pinned to a commit SHA
        run: scripts/check-actions-pinned.sh

  # Supply-chain gate: enforce the dependency license/advisory/source policy
  # in deny.toml. Fails the PR if a transitive crate carries an unapproved
  # license, an open RustSec advisory, or comes from an unexpected source.
  dep-license-check:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.lockfile == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run cargo-deny
        run: mise run deny

  # Fast feedback: formatting and linting. Unit tests run in the parallel
  # `unit-tests` job below, split out (#583) so a test failure doesn't
  # surface as a red `lint` check.
  lint:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.xtask == 'true')
    runs-on: ubuntu-latest
    env:
      # cargo-cooldown is a local-dev supply-chain guard that wraps `cargo
      # build|check|test|run|update` against cooldown.toml. CI enforces the
      # same policy at PR boundary via scripts/check-lockfile-age.sh, so
      # installing it here only adds a from-source cargo build (~2 min, ~125
      # transitive crates from crates.io) with no behavioral payoff — and a
      # crates.io network-flake surface that the policy doesn't require.
      # Disabled for this job only; mise.toml stays the source of truth for
      # local dev. Backend prefix (`cargo:`) is required — mise matches the
      # full short name and bare `cargo-cooldown` silently no-ops.
      MISE_DISABLE_TOOLS: cargo:cargo-cooldown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # mise installs the toolchain pinned in mise.toml (rust = "1.95") and
      # exports RUSTUP_TOOLCHAIN, overriding the dtolnay-installed `stable`.
      # Components from the dtolnay step were installed for `stable`, not for
      # the mise-managed 1.95.x — re-install them for the active toolchain so
      # `cargo fmt`/`cargo clippy` resolve against a complete component set.
      - name: Ensure rustfmt + clippy for mise-managed toolchain
        run: rustup component add rustfmt clippy

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check docs formatting
        run: bun run prettier --check '**/*.md' '**/*.{yml,yaml}'

      - name: Run Rust clippy
        run: mise run clippy

  # Rust unit tests (debug build). Split out of `lint` (#583) so the PR
  # check that goes red names what actually failed, and the two jobs run
  # in parallel. Same change gating as `lint`.
  unit-tests:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.xtask == 'true')
    runs-on: ubuntu-latest
    env:
      # cargo-cooldown is a local-dev guard with no CI payoff — see the
      # identical override on `lint` for the full rationale.
      MISE_DISABLE_TOOLS: cargo:cargo-cooldown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run Rust unit tests
        run: mise run test:unit

  # MSRV check — proves the source still compiles under the pinned floor
  # declared in Cargo.toml's `rust-version`. `cargo check` is enough; the
  # `unit-tests` job above already runs full build+test on stable. Cheap
  # minutes gate that prevents silent MSRV regressions when new code
  # accidentally uses post-1.95 stdlib features.
  msrv-check:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.xtask == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust 1.95 (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-1.95

      # `--locked` refuses to rewrite Cargo.lock, so a manifest/lockfile
      # mismatch (e.g. a Dependabot grouped-update PR that bumps Cargo.lock
      # past the Cargo.toml constraint) fails here instead of being silently
      # auto-fixed at build time and tripping the release-flow `git_dirty`
      # check on master.
      - name: Cargo check at MSRV
        run: cargo check --all-targets --locked

  # Windows compile check — ensures the codebase still builds for the
  # x86_64-pc-windows-msvc target that the release workflow ships. This
  # only runs `cargo check`, not a full build or test, so it stays fast
  # while catching platform-specific regressions (e.g. unconditional use
  # of `std::os::unix::*` or `libc`) before they reach a release tag.
  windows-check:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.xtask == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo check (Windows)
        run: cargo check --all-targets --locked

  # Test xtask man page generation
  xtask-test:
    needs: changes
    if:
      needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.xtask == 'true' ||
      needs.changes.outputs.man == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test xtask gen-man
        run: |
          mkdir -p /tmp/man-test
          cargo run --package xtask -- gen-man --output-dir=/tmp/man-test

          # Verify all expected man pages were generated
          for page in git-worktree-clone git-worktree-init git-worktree-checkout \
                      git-worktree-branch git-worktree-branch-delete \
                      git-worktree-prune git-worktree-carry \
                      git-worktree-fetch \
                      git-worktree-sync daft-release-notes; do
            if [ ! -f "/tmp/man-test/${page}.1" ]; then
              echo "FAILED: Missing man page: ${page}.1"
              exit 1
            fi
            # Verify it's valid groff format (has .TH header)
            if ! head -20 "/tmp/man-test/${page}.1" | grep -q '\.TH'; then
              echo "FAILED: Invalid man page format: ${page}.1"
              exit 1
            fi
            echo "  ${page}.1 - OK"
          done
          echo "All man pages generated and validated!"

      - name: Verify committed man pages are up-to-date
        run: |
          cargo run --package xtask -- gen-man --output-dir=man
          if ! git diff --exit-code man/; then
            echo "FAILED: Committed man pages are out of date!"
            echo "Run 'mise run man:gen' locally and commit the changes."
            exit 1
          fi
          echo "Committed man pages are up-to-date!"

      - name: Test xtask gen-cli-docs
        run: |
          mkdir -p /tmp/cli-docs-test
          cargo run --package xtask -- gen-cli-docs --output-dir=/tmp/cli-docs-test

          # Verify all expected CLI docs were generated
          for page in git-worktree-clone git-worktree-init git-worktree-checkout \
                      git-worktree-branch git-worktree-branch-delete \
                      git-worktree-prune git-worktree-carry \
                      git-worktree-fetch \
                      git-worktree-merge git-worktree-sync daft-doctor daft-release-notes; do
            if [ ! -f "/tmp/cli-docs-test/${page}.md" ]; then
              echo "FAILED: Missing CLI doc: ${page}.md"
              exit 1
            fi
            # Verify it has valid markdown structure (frontmatter and Usage section)
            if ! head -5 "/tmp/cli-docs-test/${page}.md" | grep -q '^---'; then
              echo "FAILED: CLI doc missing frontmatter: ${page}.md"
              exit 1
            fi
            if ! grep -q '## Usage' "/tmp/cli-docs-test/${page}.md"; then
              echo "FAILED: CLI doc missing Usage section: ${page}.md"
              exit 1
            fi
            echo "  ${page}.md - OK"
          done
          echo "All CLI docs generated and validated!"

      - name: Verify committed CLI docs are up-to-date
        run: |
          cargo run --package xtask -- gen-cli-docs --output-dir=docs/cli
          if ! git diff --exit-code docs/cli/; then
            echo "FAILED: Committed CLI docs are out of date!"
            echo "Run 'mise run docs:cli:gen' locally and commit the changes."
            exit 1
          fi
          echo "Committed CLI docs are up-to-date!"

      - name: Run xtask unit tests
        # Deliberately raw cargo, matching the rest of this job: installing
        # mise here would export RUSTUP_TOOLCHAIN from mise.toml and silently
        # move the job off `stable` onto the pinned MSRV. `mise run test:xtask`
        # is the local mirror that daft.yml's xtask-tests ring invokes — keep
        # the two commands in step by hand.
        run: cargo test --package xtask

  # Build the release binaries once, share with the integration-tests job
  build:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.xtask == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Rust binaries
        run: |
          cargo build --release
          cargo build --release --package xtask

      - name: Clean old binaries from cache
        run: |
          # Remove any old binaries that might be in cache from before src/bin/ was removed
          rm -f target/release/git-worktree-*
          echo "Cleaned old binaries from cache"

      - name: Verify single binary architecture
        run: |
          echo "Verifying single binary architecture..."
          # Count executables in target/release (excluding .d files and symlinks)
          # Use a portable approach: find files and test if executable with shell
          BINARY_COUNT=0
          for file in target/release/*; do
            if [ -f "$file" ] && [ ! -L "$file" ] && [ -x "$file" ]; then
              case "$file" in
                *.d) ;;  # Skip .d files
                *) BINARY_COUNT=$((BINARY_COUNT + 1)) ;;
              esac
            fi
          done
          echo "Found $BINARY_COUNT binary executable(s)"

          # Verify exactly 2 binaries exist (daft + xtask)
          if [ "$BINARY_COUNT" -ne 2 ]; then
            echo "ERROR: Expected exactly 2 binaries (daft + xtask), found $BINARY_COUNT"
            echo "Binaries found:"
            for file in target/release/*; do
              if [ -f "$file" ] && [ ! -L "$file" ] && [ -x "$file" ]; then
                case "$file" in
                  *.d) ;;
                  *) ls -lh "$file" ;;
                esac
              fi
            done
            exit 1
          fi

          # Verify it's named 'daft'
          if [ ! -f target/release/daft ]; then
            echo "ERROR: Binary 'daft' not found"
            exit 1
          fi

          echo "Binary architecture verified: daft + xtask binaries exist"
          ls -lh target/release/daft target/release/xtask

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daft-binary
          path: |
            target/release/daft
            target/release/xtask
          # 5 days (not 1): the integration-tests job downloads this artifact
          # rather than rebuild. Re-running only the failed jobs
          # (`gh run rerun --failed`) does NOT re-run `build`, so with a 1-day
          # window a re-run a couple of days later finds no artifact and fails at
          # "Download binary" without running any test. 5 days covers a normal
          # re-run window; a fresh full run always rebuilds regardless.
          retention-days: 5

  # Integration tests (Linux only) — one job, no matrix: the YAML scenario
  # suite, the blessed shell suite, and the completions suite, in that order.
  # The old {entry} x {suite} matrix (#220, #208) lost its reason to exist
  # when #883 removed the git-subprocess backend (the `entry` axis) — and the
  # `subprocess` entry never reached the YAML leg anyway (the runner overrides
  # GIT_CONFIG_GLOBAL per step). Folded in #885.
  #
  # Each suite provisions its own isolation — GIT_CONFIG_GLOBAL, DAFT_*_DIR,
  # DAFT_TESTING — in test_framework.sh::setup (shell), per step in the YAML
  # runner (xtask/src/manual_test/daft_executor.rs), and at the top of
  # test_completions.sh; this job sets none of it. `mise run test:integration`
  # runs the same two suites in the same order; `mise run completions:test`
  # the third.
  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Git
        run: |
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daft-binary
          path: target/release

      - name: Set up binary
        run: |
          chmod +x target/release/daft
          chmod +x target/release/xtask

          # The multicall farm comes from the same list the dev setup uses
          # (mise-tasks/setup/rust and the shared-bin path source this too),
          # so a new argv[0] arm reaches CI without a second hand-copied
          # list. The list this replaced had drifted: it was missing
          # git-worktree-push and git-worktree-warm, so a scenario invoking
          # either passed locally (the dev farm has every name) and exited
          # 127 here — or flaked green when a `doctor --fix` scenario
          # happened to run first and backfilled the shared bin dir (#903).
          source mise-tasks/setup/_rust_symlink_lib.sh
          create_daft_symlinks target/release

          echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Make test scripts executable
        run: chmod +x tests/integration/*.sh

      - name: Run YAML scenarios
        # `--jobs $(nproc)` saturates the runner — CI is dedicated to this job
        # so there's no need for `--parallel`'s `num_cpus/2` headroom for
        # concurrent local work.
        #
        # Security note: every input here is workflow-controlled (`nproc` is a
        # coreutils binary). No `${{ github.event.* }}` substitutions touch
        # the run: body.
        run: ./target/release/xtask manual-test --jobs "$(nproc)"

      - name: Run shell integration suite
        # The blessed shell suite (#447): only what the YAML runner cannot
        # express — a real PTY, signal/timing contracts, the shell wrapper's
        # cd contract. test_all.sh's sourced list is the blessed list.
        run: bash tests/integration/test_all.sh

      - name: Test shell completions
        run: ./tests/integration/test_completions.sh

  # Homebrew installation simulation (macOS)
  homebrew-simulation:
    needs: changes
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      (needs.changes.outputs.self == 'true' || needs.changes.outputs.rust ==
      'true' || needs.changes.outputs.man == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Rust binaries
        run: cargo build --release

      - name: Simulate Homebrew installation
        run: |
          PREFIX="$HOME/.local"
          mkdir -p "$PREFIX/bin" "$PREFIX/share/man/man1"

          # Install main binary
          cp target/release/daft "$PREFIX/bin/"
          chmod +x "$PREFIX/bin/daft"

          # Create symlinks for all commands (matching Homebrew formula)
          for cmd in git-worktree-clone git-worktree-checkout \
                     git-worktree-init git-worktree-branch git-worktree-branch-delete \
                     git-worktree-prune git-worktree-carry git-worktree-fetch \
                     git-worktree-merge git-worktree-sync git-daft \
                     daft-go daft-start daft-remove daft-rename; do
            ln -sf daft "$PREFIX/bin/$cmd"
          done

          # Install pre-generated man pages
          cp man/*.1 "$PREFIX/share/man/man1/"

          echo "Installation complete. Installed files:"
          ls -la "$PREFIX/bin/"
          ls -la "$PREFIX/share/man/man1/"

      - name: Verify Homebrew symlinks work
        run: |
          PREFIX="$HOME/.local"
          export PATH="$PREFIX/bin:$PATH"

          echo "Verifying daft binary..."
          daft --version

          echo "Verifying all symlinked commands..."
          for cmd in git-worktree-clone git-worktree-checkout \
                     git-worktree-init git-worktree-branch git-worktree-branch-delete \
                     git-worktree-prune git-worktree-carry git-worktree-fetch \
                     git-worktree-merge git-worktree-sync git-daft \
                     daft-go daft-start daft-remove daft-rename; do
            echo "  Testing $cmd..."
            "$PREFIX/bin/$cmd" --help > /dev/null || { echo "FAILED: $cmd --help"; exit 1; }
          done

          echo "All symlinked commands verified!"

      - name: Verify man pages
        run: |
          PREFIX="$HOME/.local"

          echo "Verifying man pages exist and are valid..."
          # Only git-worktree-* commands have man pages (not daft or git-daft)
          for page in git-worktree-clone git-worktree-checkout \
                      git-worktree-init git-worktree-branch git-worktree-branch-delete \
                      git-worktree-prune git-worktree-carry git-worktree-fetch \
                      git-worktree-merge git-worktree-sync; do
            MANFILE="$PREFIX/share/man/man1/${page}.1"
            if [ ! -f "$MANFILE" ]; then
              echo "FAILED: Missing man page: $page"
              exit 1
            fi
            # Verify it's valid groff format (has .TH header)
            if ! head -20 "$MANFILE" | grep -q '\.TH'; then
              echo "FAILED: Invalid man page format: $page"
              exit 1
            fi
            echo "  $page.1 - OK"
          done

          echo "All man pages verified!"

      - name: Test Homebrew installation with git prefix
        run: |
          PREFIX="$HOME/.local"
          export PATH="$PREFIX/bin:$PATH"

          # Verify git can discover the commands
          # Use -h instead of --help because macOS git opens man pages for --help
          echo "Testing git command discovery..."
          git worktree-clone -h > /dev/null || { echo "FAILED: git worktree-clone not found"; exit 1; }
          git worktree-checkout -h > /dev/null || { echo "FAILED: git worktree-checkout not found"; exit 1; }
          git daft -h > /dev/null || { echo "FAILED: git daft not found"; exit 1; }

          echo "Git command discovery verified!"
          echo "Homebrew simulation test PASSED!"

  # The diagram language's golden suite: the compiled digests of every hero,
  # gallery, catalog, and landing script, plus the pure semantics of verbs,
  # shell parsing, renames, and element drops. Browser-free and
  # platform-stable, so it belongs on the merge gate — a registry change that
  # silently rewrites what the docs animate must not reach master green.
  # Mirrored by the `docs-golden` pre-merge ring in daft.yml.
  #
  # The Playwright UI suite (docs/tests/ui, `mise run docs:test:ui`) is
  # deliberately NOT here yet: its specs drive real animation timing and go
  # flaky under load, so it needs a soak before it can gate merges. Tracked
  # separately; until then it is a local task, wired into no surface at all
  # rather than into a gate that would block only daft-merge users.
  docs-golden:
    needs: changes
    if:
      needs.changes.outputs.self == 'true' || needs.changes.outputs.docs ==
      'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      # `mise run docs:test:golden` is the same command with the bun-install
      # gate in front of it; the install above is that gate.
      - name: Golden tests
        working-directory: docs
        run: bun test tests/golden

  # The VitePress site builds. Lived in docs.yml as a PR-time job until the
  # merge gate needed it: a broken build (unclosed angle-bracket placeholders
  # parsed as Vue elements, a Dependabot VitePress bump) must not auto-merge,
  # and a workflow-level path filter cannot be a required check. docs.yml now
  # only deploys, on release tags. Mirrored by the `docs-build` ring.
  docs-build:
    needs: changes
    if:
      needs.changes.outputs.self == 'true' || needs.changes.outputs.docs ==
      'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Same Node as the deploy job in docs.yml: ubuntu-latest still ships
      # Node 20.x by default, and this is the combination the PR-time build
      # ran on there. Kept identical so "builds here" keeps meaning "deploys
      # there".
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: bunx vitepress build

  # The one required status check. Fans in every job above and fails if any
  # of them failed or was cancelled; skipped jobs (path-gated, or the
  # `release` label) pass. `if: always()` is load-bearing — with
  # `!cancelled()` a cancelled run would leave this job skipped, and a skipped
  # required check is a green one. Nothing here runs the code under test; it
  # only reads `needs`. `cargo test --package xtask` keeps `needs:` complete.
  ci-gate:
    needs:
      - changes
      - dep-age-check
      - release-env-guard
      - actions-pinned
      - dep-license-check
      - lint
      - unit-tests
      - msrv-check
      - windows-check
      - xtask-test
      - build
      - integration-tests
      - homebrew-simulation
      - docs-golden
      - docs-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::ci-gate: jobs not green: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "ci-gate: green"
