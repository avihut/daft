name: Benchmarks

on:
  push:
    branches: [master]
    # Same model as test.yml: default to running on any change, negate the
    # things that don't affect benchmark numbers. Self-changes to bench.yml
    # are intentionally NOT negated.
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!.github/CODEOWNERS"
      - "!.github/dependabot.yml"
      - "!.github/workflows/claude-pr-review.yml"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/mise-tool-updates.yml"
      - "!.github/workflows/release-flow.yml"
      - "!.github/workflows/release.yml"
      - "!.github/workflows/test-homebrew.yml"
      - "!.github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install hyperfine
        run: cargo install hyperfine

      - name: Build daft and set up symlinks
        run: mise run dev

      - name: Run benchmarks
        run: mise run bench

      - name: Package results
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%d')
          benches/package_results.sh "/tmp/bench-${DATE}-${COMMIT}.json"

      - name: Push to daft-benchmarks
        env:
          BENCH_REPO_TOKEN: ${{ secrets.BENCH_REPO_TOKEN }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%d')
          FILENAME="${DATE}-${COMMIT}.json"

          git clone https://x-access-token:${BENCH_REPO_TOKEN}@github.com/avihut/daft-benchmarks.git /tmp/daft-benchmarks
          cp "/tmp/bench-${FILENAME}" "/tmp/daft-benchmarks/data/${FILENAME}"
          cd /tmp/daft-benchmarks
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/${FILENAME}"
          git commit -m "bench: daft ${DATE} (${COMMIT})"
          git push

      - name: Upload raw results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: benches/results/
          retention-days: 90
