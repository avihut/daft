[install]
# See ../bunfig.toml for rationale. Duplicated because Bun reads bunfig.toml
# from the cwd, and `mise run docs:site*` invokes Bun from this directory.
minimumReleaseAge = 604800
# why: our own packages (github.com/avihut/dumbshow) — releases are consumed
# here the day they ship, and the docs pin exact versions.
minimumReleaseAgeExcludes = ["@dumbshow/core", "@dumbshow/vue"]
