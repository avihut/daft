name: Branch rows keep their last commit for nested names
description: >
  `daft list -a` looks a worktree-less local branch up under refs/heads/ and a
  remote-tracking branch under refs/remotes/ — the caller spells the namespace,
  nothing is guessed from a `/` in the short name. A local `feature/login` used
  to be looked up as refs/remotes/feature/login; the `git log` fallback silently
  repaired that miss until #883 removed it, at which point the Commit column for
  every slash-named local branch went blank.

steps:
  - name:
      Init a repo with a slash-named local branch and a nested remote-tracking
      ref
    run: |
      set -e
      export GIT_AUTHOR_NAME="Test" GIT_AUTHOR_EMAIL="test@test.com"
      export GIT_COMMITTER_NAME="Test" GIT_COMMITTER_EMAIL="test@test.com"
      daft init --layout contained nested-names
      cd $WORK_DIR/nested-names/master
      echo content > f.txt
      git add f.txt
      git commit -qm "base commit"
      tree=$(git rev-parse 'HEAD^{tree}')
      # Plumbing keeps both branches worktree-less: the main worktree stays on
      # master while each branch gets its own tip with a distinctive subject.
      git branch feature/login "$(git commit-tree -p HEAD -m 'nested local subject' "$tree")"
      git update-ref refs/remotes/origin/team/x "$(git commit-tree -p HEAD -m 'nested remote subject' "$tree")"
    expect:
      exit_code: 0

  - name: JSON rows carry the subject of each nested branch
    run: daft list -a --format json 2>&1
    cwd: "$WORK_DIR/nested-names/master"
    expect:
      exit_code: 0
      output_contains:
        - '"name": "feature/login"'
        - '"last_commit_subject": "nested local subject"'
        - '"name": "origin/team/x"'
        - '"last_commit_subject": "nested remote subject"'
