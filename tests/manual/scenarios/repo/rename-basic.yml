name: Repo rename changes the name and nothing else
description: >
  daft repo rename is metadata only — the directory keeps its name and no
  worktree moves. A name another live repo already holds is refused with the
  same error repo add --name raises.

repos:
  - name: test-repo-a
    use_fixture: standard-remote
  - name: test-repo-b
    use_fixture: standard-remote

steps:
  - name: Clone both repos
    run: |
      daft clone --layout sibling $REMOTE_TEST_REPO_A
      daft clone --layout sibling $REMOTE_TEST_REPO_B
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo-a"
        - "$WORK_DIR/test-repo-b"

  - name: Rename repo A
    run: daft repo rename test-repo-a svc 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 0
      output_contains:
        - "svc"

  - name: The catalog answers to the new name
    run: daft repo list
    expect:
      exit_code: 0
      output_contains:
        - "svc"
        - "test-repo-b"

  - name: Nothing on disk moved
    run:
      git -C $WORK_DIR/test-repo-a status --porcelain >/dev/null && echo
      "intact=yes"
    expect:
      exit_code: 0
      output_contains:
        - "intact=yes"
      dirs_exist:
        - "$WORK_DIR/test-repo-a"

  - name: The old name no longer resolves
    run: daft repo info test-repo-a 2>&1
    expect:
      exit_code: 1
      output_contains:
        - "not found in the catalog"

  - name: Renaming onto a taken name is refused
    run: daft repo rename test-repo-b svc 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 1
      output_contains:
        - "already used"

  - name: Renaming to the name it already has is a no-op, not an error
    run: daft repo rename svc svc 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 0
      output_contains:
        - "already has that name"
