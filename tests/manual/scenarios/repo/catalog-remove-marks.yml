name: Repo catalog remove marks entries
description:
  daft repo remove keeps the catalog entry as removed — hidden from the default
  list, visible with --all, still resolvable by repo info. Addressed by catalog
  name, and without --purge, so the files stay put.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0

  # The default removal is catalog-only: no prompt to skip, so no -y, and
  # nothing on disk is touched.
  - name: Remove the repo from the catalog by name
    run: daft repo remove test-repo 2>&1
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Default list hides removed entries
    run: daft repo list 2>&1
    expect:
      exit_code: 0
      output_not_contains:
        - "test-repo"

  - name: --all shows the removed entry
    run: daft repo list --all
    expect:
      exit_code: 0
      output_contains:
        - "test-repo (removed)"

  - name: repo info still resolves the removed repo
    run: daft repo info test-repo
    expect:
      exit_code: 0
      output_contains:
        - "removed"
