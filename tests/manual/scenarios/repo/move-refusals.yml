name: Move refuses before touching anything
description: >
  Every refusal is decided during planning, so a rejected move must leave the
  repository exactly as it was. Covers an occupied destination, a destination
  inside the repository, a missing parent directory, a destination that is a
  file, and an unknown repo name.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone with the sibling layout
    run: daft clone --layout sibling $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo"

  - name: An occupied destination is refused
    run: |
      mkdir -p $WORK_DIR/occupied/test-repo
      daft repo move test-repo $WORK_DIR/occupied 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 1
      output_contains:
        - "already exists"

  - name: A destination inside the repository is refused
    run: daft repo move test-repo $WORK_DIR/test-repo/inner 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 1
      output_contains:
        - "inside itself"

  - name: A destination whose parent does not exist is refused, like mv
    run: daft repo move test-repo $WORK_DIR/no-such-parent/deeper/api 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 1
      output_contains:
        - "does not exist"

  - name: A destination that is a file is refused
    run: |
      touch $WORK_DIR/a-file
      daft repo move test-repo $WORK_DIR/a-file 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 1
      output_contains:
        - "is a file"

  - name: An unknown repo is refused rather than guessed at
    run: daft repo move no-such-repo $WORK_DIR/moved 2>&1
    cwd: "$WORK_DIR"
    expect:
      exit_code: 1
      output_contains:
        - "not found in the catalog"

  - name: The repository is untouched after every refusal
    run:
      git -C $WORK_DIR/test-repo status --porcelain >/dev/null && echo
      "intact=yes"
    expect:
      exit_code: 0
      output_contains:
        - "intact=yes"
      dirs_exist:
        - "$WORK_DIR/test-repo"
