name: Merging a branch whose visitor daft.yml the target lacks propagates it
description: >
  main has no visitor daft.yml; feat/add wrote one after branching. `daft merge
  feat/add` carries the file into main whole (there is nothing on the target
  side to three-way merge against) and announces it as such. The file is
  deliberately NOT ignored here: the clean-target pre-flight must run BEFORE the
  consolidation writes the untracked daft.yml into main, or the freshly written
  file would read as "dirty" and the merge would refuse itself. Ported from
  test_daft_merge_visitor_rollback.sh (propagates_on_success).

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Create feature worktree while main has no daft.yml
    run: git-worktree-checkout -b feat/add
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      files_not_exist:
        - "$WORK_DIR/test-repo/main/daft.yml"
        - "$WORK_DIR/test-repo/feat/add/daft.yml"

  - name: feat/add commits a non-conflicting file and writes a visitor daft.yml
    run: |
      set -e
      cd $WORK_DIR/test-repo/feat/add
      printf 'feature content\n' > feature.txt
      git add feature.txt
      git commit -m "feat/add: add feature.txt"
      printf 'hooks:\n  post-clone:\n    jobs:\n      - run: echo from-feat-add\n' > daft.yml
    expect:
      exit_code: 0

  - name: The merge succeeds and announces the whole-file adoption
    run: daft merge --no-edit feat/add 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - "Consolidated daft.yml from feat/add"
        - "entire file — target has none"
      # #902: the whole-file case is a scope, not a one-element key list.
      # While it was smuggled through `adopt_keys` as prose, this line read
      # `adopted 1 key(s) ((entire file — target has none))` — the count is
      # the symptom a future sentinel would resurrect silently.
      output_not_contains:
        - "(("
        - "key(s)"

  - name: main now holds the propagated daft.yml
    run: cat $WORK_DIR/test-repo/main/daft.yml
    expect:
      exit_code: 0
      file_contains:
        - path: "$WORK_DIR/test-repo/main/daft.yml"
          content: "from-feat-add"

  - name: The merge itself landed
    run: git -C $WORK_DIR/test-repo/main merge-base --is-ancestor feat/add main
    expect:
      exit_code: 0
