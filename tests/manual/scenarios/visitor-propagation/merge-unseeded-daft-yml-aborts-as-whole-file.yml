name: A merge conflict with no seed base is announced as the whole file
description: >
  feat/x's daft.yml was hand-authored after the worktree existed, so daft never
  seeded it - there is no base, and consolidation cannot reason per key. A
  non-interactive merge must still abort, and must say the choice is the whole
  file rather than printing a one-element key list. Regression for #902: the
  no-base case used to travel as the prose string "(entire file - no seed
  provenance)" inside conflict_keys, so the abort read "has conflicting
  refinements ((entire file - no seed provenance))" - doubled parentheses from a
  sentinel the message then parenthesised again.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Ignore daft files and push so new worktrees inherit the ignore
    run: |
      set -e
      cd $WORK_DIR/test-repo/main
      printf 'daft.yml\ndaft.local.yml\n' > .gitignore
      git add .gitignore
      git commit -m "ignore untracked daft files"
      git push origin main
    expect:
      exit_code: 0

  - name: Create the feature worktree while main has no daft.yml to seed
    run: git-worktree-checkout -b feat/x
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      files_not_exist:
        - "$WORK_DIR/test-repo/feat/x/daft.yml"

  - name: Both sides hand-author a different daft.yml afterwards
    run: |
      set -e
      printf 'shared:\n  - .env\n' > $WORK_DIR/test-repo/main/daft.yml
      printf 'shared:\n  - .tool-versions\n' > $WORK_DIR/test-repo/feat/x/daft.yml
      cd $WORK_DIR/test-repo/feat/x
      printf 'feature work\n' > feature.txt
      git add feature.txt
      git commit -m "feature work"
    expect:
      exit_code: 0

  - name: The merge aborts and names the whole file, not a phantom key
    run: daft merge --no-edit feat/x 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 1
      output_contains:
        - "conflicting refinements"
        - "the whole file — no seed provenance"
        - "daft file merge"
      output_not_contains:
        - "(("
        - "key(s)"

  - name: main's daft.yml is untouched and the git merge never ran
    run: git -C $WORK_DIR/test-repo/main merge-base --is-ancestor feat/x main
    expect:
      exit_code: 1
      file_contains:
        - path: "$WORK_DIR/test-repo/main/daft.yml"
          content: ".env"
      file_not_contains:
        - path: "$WORK_DIR/test-repo/main/daft.yml"
          content: ".tool-versions"
