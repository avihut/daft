name: "Clone with --quiet flag"
description:
  "The --quiet flag suppresses clone's own output — the completion line and the
  shell-integration hint — while still creating the expected structure. (The
  live region is already hidden under DAFT_TESTING, so those two lines are what
  a non-quiet clone prints here.)"

repos:
  - name: test-repo-quiet
    use_fixture: standard-remote

steps:
  - name: "Clone with --quiet flag"
    run:
      "git-worktree-clone --quiet --layout contained $REMOTE_TEST_REPO_QUIET
      2>&1"
    expect:
      exit_code: 0
      dirs_exist:
        - "test-repo-quiet"
        - "test-repo-quiet/main"
      output_not_contains:
        - "Cloned into"
        - "hint:"
