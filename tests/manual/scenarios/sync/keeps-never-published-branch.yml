name: Sync keeps a branch that was never published
description: >
  Sync's first phase is prune, which is how issue #858 was actually hit - the
  next `daft sync` after a `daft start` undid the start. The sibling of the
  prune regression: a branch nothing attests to must survive a full sync run.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Start a branch and never push it
    run: git-worktree-checkout -b feat/fresh
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"

  - name: Sync leaves it alone
    run: daft sync 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_not_contains:
        - "pruned feat/fresh"
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"
      branch_exists:
        - repo: "$WORK_DIR/test-repo/main"
          branch: "feat/fresh"
