name: config emits a machine-readable form from every verb
description:
  Verify a read's document always carries the ladder, that --format never moves
  the exit code, and that a write records every key it touched — which for a
  behavior is the only place the individual writes are reported

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: a read carries the whole ladder without being asked for --origin
    run: daft config get daft.remote --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"layers"'
        - '"diagnostics"'
        - '"writable_scopes"'
        - '"effective"'

  - name: a narrowed read reports the layer's own value and what outranks it
    run: |
      daft config set --global daft.remote shared
      daft config set --local daft.remote mine
      daft config get daft.remote --global --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"scope": "global"'
        - '"value": "shared"'
        - '"effective": "mine"'
        - '"outranked_by": "local"'

  - name: --format does not turn a silent layer into a success
    run: daft config get daft.merge.style --local --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 1
      output_contains:
        - "daft.merge.style"

  - name: a behavior read names its state, its presets, and its members
    run: daft config get remote-sync --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"kind": "behavior"'
        - '"state":'
        - '"presets"'
        - '"members"'

  - name: a behavior write records every key and the state it ended in
    run: daft config set remote-sync on --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"action": "set"'
        - '"state": "on"'
        - "daft.checkout.fetch"
        - "daft.checkout.push"
        - "daft.branchDelete.remote"

  - name: a setting write names the store it landed in, not just the scope
    run: |
      printf 'rc: .daftrc\n' > daft.yml
      daft config set --local rc overlay.rc --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"store": "local overlay"'
        - "daft.local.yml"

  - name: an unset that removed nothing is a success that changed nothing
    run: daft config unset daft.merge.style --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"action": "unset"'
        - '"changed": false'

  - name: list narrowed to a layer carries the outrank warning as a column
    run: daft config list --global --format json
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - '"outranked_by"'

  - name: Clean up the global value this scenario wrote
    run: daft config unset --global daft.remote
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
