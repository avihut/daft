name: push with an unrecognized hook keeps today's behavior
description:
  "The silent-fallback contract (#753): a plain pre-push hook no recognizer
  claims declines on its first line and passes through untouched. The push
  behaves exactly as before the feature — success, remote updated, exit 0.
  Byte-identical rendering is pinned by the wrapper's unit tests; this guards
  the behavior end-to-end through a real git push."

repos:
  - name: push-gate-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_PUSH_GATE_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/push-gate-repo/main"

  - name: Checkout the feature branch
    run: git-worktree-checkout feature/test-feature
    cwd: "$WORK_DIR/push-gate-repo/main"
    expect:
      exit_code: 0

  - name: Commit a change on the feature branch
    run: |
      echo "change" > change.txt
      git add change.txt
      GIT_AUTHOR_EMAIL="me@example.com" GIT_COMMITTER_EMAIL="me@example.com" \
        git commit -m "Change"
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect: { exit_code: 0 }

  - name: Install a plain (non-manager) pre-push hook
    run: |
      mkdir -p $WORK_DIR/test-hooks
      cat > $WORK_DIR/test-hooks/pre-push <<'HOOK'
      #!/bin/sh
      echo "Running pre-push checks..."
      echo "  -> custom lint"
      echo "All checks passed."
      exit 0
      HOOK
      chmod +x $WORK_DIR/test-hooks/pre-push
      git config core.hooksPath $WORK_DIR/test-hooks
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect: { exit_code: 0 }

  - name: push succeeds through the declined stream
    run: git-worktree-push 2>&1
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect:
      exit_code: 0
      output_contains:
        - "Pushed 'feature/test-feature'"

  - name: The remote branch was updated
    run: |
      git fetch origin 2>/dev/null
      git rev-list --count origin/feature/test-feature..feature/test-feature
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect:
      exit_code: 0
      output_contains: ["0"]
