name: sync --push with recognized lefthook output keeps its semantics
description:
  "sync's push path with a lefthook-grammar pre-push hook (#753): the recognizer
  engages on the manager's stream and must not corrupt the push — the branch
  lands on the remote and the run exits 0. Sub-row rendering and the scoped
  failure report are pinned by TuiPresenter/state unit tests; the sandbox
  (DAFT_TESTING) suppresses hook chrome."

repos:
  - name: push-gate-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_PUSH_GATE_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/push-gate-repo/main"

  - name: Set local identity so the feature branch is owned
    run: |
      git config user.email "me@example.com"
      git config user.name "Me Testuser"
    cwd: "$WORK_DIR/push-gate-repo/main"
    expect: { exit_code: 0 }

  - name: Checkout the feature branch
    run: git-worktree-checkout feature/test-feature
    cwd: "$WORK_DIR/push-gate-repo/main"
    expect:
      exit_code: 0

  - name: Commit an owned change on the feature branch
    run: |
      echo "owned change" > owned.txt
      git add owned.txt
      GIT_AUTHOR_EMAIL="me@example.com" GIT_COMMITTER_EMAIL="me@example.com" \
        git commit -m "Owned commit"
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect: { exit_code: 0 }

  - name: Install a hook that emits lefthook 2.x piped grammar
    run: |
      mkdir -p $WORK_DIR/test-hooks
      cat > $WORK_DIR/test-hooks/pre-push <<'HOOK'
      #!/bin/sh
      printf '╭─────────────────────────────────────────╮\n'
      printf '│ 🥊 lefthook v9.9.9-test  hook: pre-push │\n'
      printf '╰─────────────────────────────────────────╯\n'
      printf '┃  fmt ❯ \n'
      printf 'fmt clean\n'
      printf '\n'
      printf '┃  unit tests (related) ❯ \n'
      printf 'all passed\n'
      printf '\n'
      printf '  ────────────────────────────────────\n'
      printf 'summary: (done in 0.42 seconds)\n'
      printf '✔️ fmt (0.20 seconds)\n'
      printf '✔️ unit tests (related) (0.42 seconds)\n'
      exit 0
      HOOK
      chmod +x $WORK_DIR/test-hooks/pre-push
      git config core.hooksPath $WORK_DIR/test-hooks
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect: { exit_code: 0 }

  - name: sync --push succeeds through the engaged recognizer
    run: git-worktree-sync --push 2>&1
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect:
      exit_code: 0
      output_contains:
        - "Pushed 1 branch"

  - name: The remote branch was updated
    run: |
      git fetch origin 2>/dev/null
      git rev-list --count origin/feature/test-feature..feature/test-feature
    cwd: "$WORK_DIR/push-gate-repo/feature/test-feature"
    expect:
      exit_code: 0
      output_contains: ["0"]
