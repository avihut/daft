name: Transform a non-default main working tree to nested
description: >
  #859 for a layout that leaves the root in place: the main working tree stays
  at the project root on its feature branch, and only the linked worktree moves
  into `.worktrees/`.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone with plain git and switch to a local-only branch
    run: |
      git clone -q $REMOTE_TEST_REPO test-repo
      git -C $WORK_DIR/test-repo switch -q -c task/local-docker
    expect:
      exit_code: 0

  - name: Add a linked worktree beside the clone
    run:
      git -C $WORK_DIR/test-repo worktree add -q $WORK_DIR/test-repo.develop
      develop
    expect:
      exit_code: 0

  - name: Transform to nested
    run: daft layout transform nested 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 0
      output_contains:
        - "Transformed"

  - name: The root keeps its feature branch, develop moves under .worktrees
    run: git -C $WORK_DIR/test-repo worktree list
    expect:
      exit_code: 0
      files_exist:
        - "$WORK_DIR/test-repo/README.md"
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo"
          branch: task/local-docker
        - dir: "$WORK_DIR/test-repo/.worktrees/develop"
          branch: develop

  - name: Both worktrees are clean
    run:
      test -z "$(git -C $WORK_DIR/test-repo status --porcelain | grep -v
      '.gitignore')$(git -C $WORK_DIR/test-repo/.worktrees/develop status
      --porcelain | grep -v '.gitignore')"
    expect:
      exit_code: 0
