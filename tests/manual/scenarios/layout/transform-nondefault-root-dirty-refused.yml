name: A dirty non-default main working tree is refused without --force
description: >
  #859: the dirty-tree guard used to inspect only the default branch's worktree,
  so a dirty main working tree on any other branch walked straight into the
  transform. Refusing must leave the repository untouched — index included.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone with plain git, switch branch, and dirty the tree
    run: |
      git clone -q $REMOTE_TEST_REPO test-repo
      git -C $WORK_DIR/test-repo switch -q -c task/local-docker
      echo "local change" >> $WORK_DIR/test-repo/README.md
    expect:
      exit_code: 0

  - name: Transform is refused
    run: daft layout transform contained 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 1
      output_contains:
        - "uncommitted changes"
        - "task/local-docker"

  - name: Nothing moved and the index is intact
    run: git -C $WORK_DIR/test-repo config --get core.bare
    expect:
      exit_code: 0
      output_contains:
        - "false"
      files_exist:
        - "$WORK_DIR/test-repo/README.md"
        - "$WORK_DIR/test-repo/.git/index"
      files_not_exist:
        - "$WORK_DIR/test-repo/task/local-docker/README.md"
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo"
          branch: task/local-docker

  - name: The local change is still there
    run: git -C $WORK_DIR/test-repo status --porcelain
    expect:
      exit_code: 0
      output_contains:
        - "M README.md"
