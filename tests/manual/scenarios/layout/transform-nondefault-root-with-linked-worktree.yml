name: Transform a non-default main working tree that has linked worktrees
description: >
  #859 with company: the main working tree on a feature branch nests, and the
  linked worktree for the default branch is relocated as an ordinary worktree.
  Both must come out clean.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone with plain git and switch to a local-only branch
    run: |
      git clone -q $REMOTE_TEST_REPO test-repo
      git -C $WORK_DIR/test-repo switch -q -c task/local-docker
    expect:
      exit_code: 0

  - name: Add a daft worktree for develop
    run: git-worktree-checkout develop 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo.develop"

  - name: Transform to contained
    run: daft layout transform contained 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 0
      output_contains:
        - "main working tree on 'task/local-docker'"
        - "Transformed"

  - name: Both worktrees land under the project root
    run: git -C $WORK_DIR/test-repo worktree list
    expect:
      exit_code: 0
      files_exist:
        - "$WORK_DIR/test-repo/task/local-docker/README.md"
        - "$WORK_DIR/test-repo/develop/README.md"
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo/task/local-docker"
          branch: task/local-docker
        - dir: "$WORK_DIR/test-repo/develop"
          branch: develop

  - name: Both worktrees are clean
    run:
      test -z "$(git -C $WORK_DIR/test-repo/task/local-docker status --porcelain
      | grep -v '.gitignore')$(git -C $WORK_DIR/test-repo/develop status
      --porcelain | grep -v '.gitignore')"
    expect:
      exit_code: 0
