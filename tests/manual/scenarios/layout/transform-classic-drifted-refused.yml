name: A contained-classic clone that switched branches is refused, not crashed
description: >
  The clone directory is named after the branch it was created on. Switch
  branches inside it and the target layout wants the main working tree at a
  different subdirectory — which git will not move. Refuse at plan time with a
  two-step remedy instead of failing halfway through (#859).

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone with contained-classic and switch the clone's branch
    run: |
      git-worktree-clone --layout contained-classic $REMOTE_TEST_REPO
      git -C $WORK_DIR/test-repo/main switch -q -c task/local-docker
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main/.git"

  - name: Transform to contained is refused
    run: daft layout transform contained 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 1
      output_contains:
        - "cannot move a main working tree"
        - "transform sibling"

  - name: The clone is untouched
    run: git -C $WORK_DIR/test-repo/main config --get core.bare
    expect:
      exit_code: 0
      output_contains:
        - "false"
      files_exist:
        - "$WORK_DIR/test-repo/main/README.md"
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo/main"
          branch: task/local-docker

  - name: Remedy step one — transform to sibling
    run: daft layout transform sibling 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo"
          branch: task/local-docker
      # The clone directory the collapse emptied must not survive. It cannot be
      # removed during the collapse itself — a main working tree's `.git` is a
      # real directory, so the `remove_dir` there always fails — so `MoveGitDir`
      # reaps it once `.git` has moved out. Git does not track empty
      # directories, so no status- or content-based assertion can see this; it
      # has to be checked on the filesystem.
      files_not_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Remedy step two — transform to contained
    # Run from the project root: step one collapsed the clone into it, so the
    # old `test-repo/main` cwd is gone (the shell wrapper cd-redirects a real
    # user; a raw binary invocation has to say where it stands).
    run: daft layout transform contained 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 0
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo/task/local-docker"
          branch: task/local-docker
      # Had step one left the emptied clone dir behind, this nest would have
      # swept it into the new worktree as `task/local-docker/main`.
      files_not_exist:
        - "$WORK_DIR/test-repo/task/local-docker/main"
