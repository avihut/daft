name: A bare repo with no default-branch worktree and several candidates refuses
description: >
  The mirror of #859 when the choice is not decidable: with the default branch
  unworktreed and more than one worktree that could take the repository root,
  daft refuses before touching anything rather than guessing from the cwd.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone contained and add two feature worktrees
    run: |
      git-worktree-clone --layout contained $REMOTE_TEST_REPO
      cd $WORK_DIR/test-repo/main
      git-worktree-checkout develop
      git-worktree-checkout -b task/local-docker
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/develop"
        - "$WORK_DIR/test-repo/task/local-docker"

  - name: Drop the default branch's worktree with plain git
    run: git -C $WORK_DIR/test-repo worktree remove $WORK_DIR/test-repo/main
    expect:
      exit_code: 0

  - name: Transform to sibling is refused
    run: daft layout transform sibling 2>&1
    cwd: "$WORK_DIR/test-repo/task/local-docker"
    expect:
      exit_code: 1
      output_contains:
        - "'main' has no worktree"
        - "daft go main"

  - name: Nothing moved
    run: git -C $WORK_DIR/test-repo config --get core.bare
    expect:
      exit_code: 0
      output_contains:
        - "true"
      files_exist:
        - "$WORK_DIR/test-repo/develop/README.md"
        - "$WORK_DIR/test-repo/task/local-docker/README.md"
