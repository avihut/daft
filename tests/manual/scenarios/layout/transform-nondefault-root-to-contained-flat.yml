name: Transform a non-default main working tree to contained-flat
description: >
  #859 against a template that sanitizes slashes: the main working tree on
  `task/local-docker` nests into `task-local-docker`.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone with plain git and switch to a local-only branch
    run: |
      git clone -q $REMOTE_TEST_REPO test-repo
      git -C $WORK_DIR/test-repo switch -q -c task/local-docker
    expect:
      exit_code: 0

  - name: Transform to contained-flat
    run: daft layout transform contained-flat 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 0
      output_contains:
        - "main working tree on 'task/local-docker'"
        - "Transformed"

  - name: The slashes are flattened, not nested
    run:
      test -z "$(git -C $WORK_DIR/test-repo/task-local-docker status --porcelain
      | grep -v '.gitignore')"
    expect:
      exit_code: 0
      files_exist:
        - "$WORK_DIR/test-repo/task-local-docker/README.md"
      files_not_exist:
        - "$WORK_DIR/test-repo/task/local-docker/README.md"
      is_git_worktree:
        - dir: "$WORK_DIR/test-repo/task-local-docker"
          branch: task/local-docker
