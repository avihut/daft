name: A commit subject cannot manufacture a publication record
description: >
  Prune's backfill records branches it observes on the remote, so branches
  published outside daft become reclaimable. It used to read that observation
  off `git branch -vv`, where `[%(upstream:short)]` and `%(subject)` are printed
  with no delimiter between them - so a branch with no upstream at all, whose
  commit subject begins `[origin/<its own name>]`, was byte-identical to one
  that really tracked it, and got stamped as published. That record is what
  authorizes deleting a branch later, so a commit message could talk prune into
  #858's failure class one run in advance. The backfill now reads git config,
  which a commit message has no way into.

  The branch here deliberately has no worktree. For a branch checked out in
  another worktree git inserts the worktree path between the object name and the
  subject, and that extra token is what accidentally shielded the parser - so a
  worktree-backed branch cannot show the defect at all. A plain `git branch`, or
  a branch whose worktree was removed, is the shape that reaches it; the
  fixture's own `develop` is one.

  The impersonation is staged in git's own `branch -vv` output (the check below
  greps it there) to prove the backfill no longer reads that rendering at all:
  its observation is a config read, so the spoof has nowhere to land.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Leave a worktree-less branch whose subject impersonates tracking info
    run: |
      cd $WORK_DIR/test-repo/main
      printf 'y\n' > spoof.txt
      git add spoof.txt
      git commit -m "[origin/feat/spoof] wip"
      git branch feat/spoof
      git reset --hard HEAD~1
    expect:
      exit_code: 0

  - name: The lookalike is really there, and the branch really has no upstream
    run: |
      cd $WORK_DIR/test-repo/main
      git branch -vv | grep feat/spoof | grep -q '\[origin/feat/spoof\]' \
        && echo "tracking-lookalike-present"
      git config branch.feat/spoof.remote || echo "spoof-has-no-upstream"
      test ! -d $WORK_DIR/test-repo/feat/spoof && echo "and-no-worktree"
    expect:
      exit_code: 0
      output_contains:
        - "tracking-lookalike-present"
        - "spoof-has-no-upstream"
        - "and-no-worktree"

  - name: Prune runs and observes nothing, because config says nothing
    run: git-worktree-prune 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0

  - name: No publication record was fabricated from the subject
    run: git config branch.feat/spoof.daftPublished || echo "spoof-unrecorded"
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - "spoof-unrecorded"
