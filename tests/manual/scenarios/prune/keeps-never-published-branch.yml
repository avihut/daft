name: Prune keeps a branch that was never published
description: >
  A branch `daft start` just created is absent from the remote for the same
  reason a deleted one is - nothing local tells them apart - and a zero-commit
  branch is trivially an ancestor of the default branch, so the merged check
  waves it through. Prune must leave it alone: nothing attests it was ever on
  the remote. --force skips the merged guard, not identification, so it must not
  widen the scope either. Regression for issue #858.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Start a branch and never push it
    run: git-worktree-checkout -b feat/fresh
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"

  - name: It has no upstream and no commits of its own
    run: |
      git config branch.feat/fresh.remote || echo "no-upstream"
      test -z "$(git rev-list main..feat/fresh)" && echo "no-own-commits"
    cwd: "$WORK_DIR/test-repo/feat/fresh"
    expect:
      exit_code: 0
      output_contains:
        - "no-upstream"
        - "no-own-commits"

  - name: Prune leaves it alone and does not report it
    run: git-worktree-prune 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_not_contains:
        - "pruned feat/fresh"
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"
      branch_exists:
        - repo: "$WORK_DIR/test-repo/main"
          branch: "feat/fresh"

  - name: --force does not widen prune's scope to it either
    run: git-worktree-prune --force 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_not_contains:
        - "pruned feat/fresh"
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"
      branch_exists:
        - repo: "$WORK_DIR/test-repo/main"
          branch: "feat/fresh"
