name: A commit subject cannot pass for a gone upstream
description: >
  Prune's first arm asks git which branches have a gone upstream by matching `:
  gone]` anywhere in a `git branch -vv` line - and that line ends with the
  commit subject, which git prints with no delimiter after the tracking bracket.
  A subject like `fix: gone] handling` therefore matches on a branch that has no
  upstream at all, and since a zero-commit branch is trivially an ancestor of
  the default branch, the gone-but-unmerged guard waves it through. That deletes
  a branch nobody ever published: #858's failure class reached through a commit
  message. The match is now cross-checked against `branch.<name>.remote`, which
  excludes nothing real - git only prints the bracket when an upstream is
  configured.

  Pinned to the git-subprocess backend on purpose. Only `git branch -vv` itself
  prints the subject; daft's gitoxide rendering builds the line from config and
  appends none, so under the default backend the impersonation is not
  expressible and this scenario would pass against the bug it is here to catch.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: git-worktree-clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Read branch state through git itself, where the subject is rendered
    run: git config daft.gitoxide false
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0

  - name: "Put a `: gone]` subject on the default branch"
    run: |
      cd $WORK_DIR/test-repo/main
      printf 'x\n' > parser.txt
      git add parser.txt
      git commit -m "fix: gone] handling in the parser"
      git push origin main
    expect:
      exit_code: 0

  - name: Start a branch that inherits it and is never pushed
    run: git-worktree-checkout -b feat/fresh
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"

  - name: The lookalike is really there, and the branch really has no upstream
    run: |
      cd $WORK_DIR/test-repo/main
      git branch -vv | grep -q ': gone]' && echo "gone-lookalike-present"
      git config branch.feat/fresh.remote || echo "fresh-has-no-upstream"
      test -z "$(git rev-list main..feat/fresh)" && echo "no-own-commits"
    expect:
      exit_code: 0
      output_contains:
        - "gone-lookalike-present"
        - "fresh-has-no-upstream"
        - "no-own-commits"

  - name: Prune asks config whether the upstream is real, and keeps it
    run: git-worktree-prune 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_not_contains:
        - "pruned feat/fresh"
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"
      branch_exists:
        - repo: "$WORK_DIR/test-repo/main"
          branch: "feat/fresh"

  - name: --force does not widen the scope to it either
    run: git-worktree-prune --force 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/feat/fresh"
      branch_exists:
        - repo: "$WORK_DIR/test-repo/main"
          branch: "feat/fresh"
