name: Branch delete refuses unmerged
description:
  Rejects an unmerged branch whose commits exist nowhere else, without --force

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  # Deliberately NOT pushed. Since #783 a branch identical to a surviving
  # remote branch is lossless to delete and no longer needs -f, so pushing
  # here would test the opposite of what this scenario is named for. The
  # pushed case has its own scenario: allows-fully-pushed.yml.
  - name: Clone and create an unpushed feature branch
    run: |
      git-worktree-clone --layout contained $REMOTE_TEST_REPO
      cd $WORK_DIR/test-repo
      git-worktree-checkout -b feature/unmerged
      cd $WORK_DIR/test-repo/feature/unmerged
      echo "unmerged work" > unmerged.txt
      git add unmerged.txt
      git commit -m "Unmerged work"
    expect:
      exit_code: 0

  - name: Delete without --force should fail
    run: git-worktree-branch-delete feature/unmerged 2>&1
    cwd: "$WORK_DIR/test-repo"
    expect:
      exit_code: 1
      output_contains:
        - "not merged"
      dirs_exist:
        - "$WORK_DIR/test-repo/feature/unmerged"
