name: Warm reads the source's daft.local.yml overlay
description: >
  `copy:` deliberately reads through the merged loader rather than the raw
  single-file reader `shared:` uses, so `daft.local.yml` and `extends:` reach it
  and a visitor can declare caches without touching the tracked config. Creation
  has a scenario for that claim; warm had none, even though warm is the command
  a visitor actually runs — their worktrees already exist.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: daft clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Create a second worktree while nothing is declared
    run: daft go develop
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/develop"

  # The tracked daft.yml declares nothing to copy; only the untracked local
  # overlay does. A raw single-file read of daft.yml would find an empty
  # section and silently do nothing.
  - name: Declare the cache only in the source's untracked local overlay
    run: |
      printf 'node_modules/\n' > .gitignore
      printf 'hooks:\n  worktree-post-create: []\n' > daft.yml
      printf 'copy:\n  - node_modules/\n' > daft.local.yml
      mkdir -p node_modules/pkg
      printf 'built-in-main\n' > node_modules/pkg/index.js
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0

  - name: The overlay's declaration is what warm copies
    run: daft warm develop 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - "node_modules"
        - "Copied 1 of 1 declared path"
      output_not_contains:
        - "No `copy:` paths declared"
      files_exist:
        - "$WORK_DIR/test-repo/develop/node_modules/pkg/index.js"
      file_contains:
        - path: "$WORK_DIR/test-repo/develop/node_modules/pkg/index.js"
          content: "built-in-main"

  # The overlay belongs to the SOURCE, not the destination: the config travels
  # with the cache it describes.
  - name: An overlay in the target does not declare the source's caches
    run: |
      rm "$WORK_DIR/test-repo/main/daft.local.yml"
      printf 'copy:\n  - node_modules/\n' > "$WORK_DIR/test-repo/develop/daft.local.yml"
      rm -rf "$WORK_DIR/test-repo/develop/node_modules"
      daft warm develop 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - "No `copy:` paths declared in 'main'"
      files_not_exist:
        - "$WORK_DIR/test-repo/develop/node_modules/pkg/index.js"
