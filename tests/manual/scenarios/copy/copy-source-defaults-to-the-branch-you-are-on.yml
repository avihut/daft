name:
  A base nobody named is the branch you are on, and its cache is the one copied
description: >
  `daft start feat` with no base branches from the branch you are on, so the
  base rung of the source ladder resolves to the worktree you are standing in
  and its caches are the ones copied (#387). That is the common shape, and it
  matters most to the person who works out of a long-lived feature worktree and
  branches off it all day: its caches are the warm ones, and main's may be
  months stale or absent.

  The outcome looks like the old "source is wherever you stand" rule and is
  reached for a different reason, which is exactly why it needs pinning
  separately from `copy-source-prefers-the-named-base`: that scenario proves a
  NAMED base wins over cwd, and this one proves the default base does not
  accidentally become the default branch on the way. Every other creation
  scenario runs from the default-branch worktree, where the two answers are the
  same directory and no assertion could tell them apart.

  So the fixture makes the answers distinguishable: main and develop hold the
  same declared entry with different contents, and a branch is started from
  inside develop. The copied cache identifies its origin. It also pins the
  config's origin, which travels with the standing worktree rather than the
  resolved source — a regression that re-rooted the read at the default branch
  fails here and nowhere else.

repos:
  - name: copy-origin
    default_branch: main
    branches:
      - name: main
        files:
          - path: README.md
            content: "# copy-origin"
          - path: .gitignore
            content: |
              cache/
        commits:
          - message: "Initial commit"
      - name: develop
        from: main
    daft_yml: |
      copy:
        - cache/

steps:
  - name: Clone the repository
    run: daft clone --layout contained $REMOTE_COPY_ORIGIN
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/copy-origin/main"

  - name: Build a cache in main that says where it came from
    # `set -e`: step bodies run under `bash -c` with no errexit, so without it
    # only the last command's status is reported.
    run: |
      set -e
      mkdir -p cache
      printf 'from-main\n' > cache/who.txt
      git check-ignore cache
    cwd: "$WORK_DIR/copy-origin/main"
    expect:
      exit_code: 0

  - name: Check out develop from main — it inherits main's cache
    run: daft go develop 2>&1
    cwd: "$WORK_DIR/copy-origin/main"
    expect:
      exit_code: 0
      file_contains:
        - path: "$WORK_DIR/copy-origin/develop/cache/who.txt"
          content: "from-main"

  - name: Rebuild develop's cache so the two worktrees now disagree
    run: |
      set -e
      printf 'from-develop\n' > cache/who.txt
      test -f "$WORK_DIR/copy-origin/main/cache/who.txt"
    cwd: "$WORK_DIR/copy-origin/develop"
    expect:
      exit_code: 0

  - name: Starting a branch from develop copies DEVELOP's cache
    run: daft start feat-origin 2>&1
    cwd: "$WORK_DIR/copy-origin/develop"
    expect:
      exit_code: 0
      output_contains:
        - "Copied cache"
      files_exist:
        - "$WORK_DIR/copy-origin/feat-origin/cache/who.txt"
      file_contains:
        - path: "$WORK_DIR/copy-origin/feat-origin/cache/who.txt"
          content: "from-develop"
      file_not_contains:
        - path: "$WORK_DIR/copy-origin/feat-origin/cache/who.txt"
          content: "from-main"

  - name: Neither existing worktree's cache was disturbed
    run: "true"
    expect:
      exit_code: 0
      file_contains:
        - path: "$WORK_DIR/copy-origin/main/cache/who.txt"
          content: "from-main"
        - path: "$WORK_DIR/copy-origin/develop/cache/who.txt"
          content: "from-develop"
