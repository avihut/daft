name: Warm with no copy declaration explains itself
description: >
  The first thing most users will see: `daft warm` in a repo whose daft.yml has
  no `copy:` section. It must be a zero-exit no-op that names the worktree whose
  config was read and says where to declare the caches — not an error, and not a
  silent success that leaves the user wondering whether anything happened.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: daft clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Create a second worktree
    run: daft go develop
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/develop"

  # No daft.yml at all — the "nothing to do" case must not depend on a config
  # file existing.
  - name: Warming with nothing declared succeeds and says why
    run: daft warm develop 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - "No `copy:` paths declared in 'main'"
        - "daft.yml"
      output_not_contains:
        - "Copied"

  - name: A daft.yml without a copy section is the same case
    run: |
      printf 'hooks:\n  worktree-post-create: []\n' > daft.yml
      daft warm develop 2>&1
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      output_contains:
        - "No `copy:` paths declared in 'main'"
