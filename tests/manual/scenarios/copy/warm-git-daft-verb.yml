name: git-daft worktree-warm dispatches to warm with its flags intact
description: >
  The git-style spelling `git daft worktree-warm` reaches the same command as
  `daft warm`: the git-daft arm rewrites argv to the warm verb and `--from` must
  survive that rewrite. The receipt names both ends of the copy, so the source
  being the one `--from` chose is visible in the output. Ported from
  test_warm.sh (warm_git_daft_verb_dispatches); only the `git-daft` symlink is
  used because CI's binary setup does not create `git-worktree-warm`.

repos:
  - name: test-repo
    use_fixture: standard-remote

steps:
  - name: Clone the repository
    run: daft clone --layout contained $REMOTE_TEST_REPO
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/main"

  - name: Create a second worktree while no copy paths are declared
    run: daft go develop
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/test-repo/develop"

  - name: Build a gitignored cache in main and declare it there
    run: |
      set -e
      printf 'node_modules/\n' > .gitignore
      printf 'copy:\n  - node_modules/\n' > daft.yml
      mkdir -p node_modules/pkg
      printf 'built-in-main\n' > node_modules/pkg/index.js
      # The engine only copies gitignored entries; fail here, not later, if
      # the fixture ever stops satisfying that.
      git check-ignore node_modules
    cwd: "$WORK_DIR/test-repo/main"
    expect:
      exit_code: 0

  - name: git-daft worktree-warm --from main warms develop from main
    run: git-daft worktree-warm --from main 2>&1
    cwd: "$WORK_DIR/test-repo/develop"
    expect:
      exit_code: 0
      output_contains:
        - "Copied 1 of 1 declared path"
        - "from 'main'"
      files_exist:
        - "$WORK_DIR/test-repo/develop/node_modules/pkg/index.js"
      file_contains:
        - path: "$WORK_DIR/test-repo/develop/node_modules/pkg/index.js"
          content: "built-in-main"

  # The replica is an independent directory, not a symlink back into main —
  # that is `shared:`'s job. `test ! -L` alone passes on a missing path, so
  # both halves are asserted.
  - name: The copied cache is a real directory, not a symlink
    run: test -d node_modules && test ! -L node_modules
    cwd: "$WORK_DIR/test-repo/develop"
    expect:
      exit_code: 0
