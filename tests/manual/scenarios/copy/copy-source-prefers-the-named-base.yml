name: The named base branch's cache wins over the worktree you ran from
description: >
  `daft start feature-b master` says which content the new worktree will hold,
  so master's caches are the ones that match it — from wherever the command was
  typed. The stage originally borrowed the resolver written for visitor config
  propagation, whose first arm returns the worktree you are standing in before
  the base is ever consulted, so a user standing in a long-lived feature
  worktree got that worktree's caches no matter which base they named. The base
  was already being passed in; it was simply never read.

  The fixture makes the two answers say which one they are: main and develop
  hold the same declared entry with different contents, and the branch is
  started from inside develop naming main. Both worktrees also sit at the same
  commit, which is what makes this a test of the BASE-BRANCH rung specifically:
  fall through to the identical-commit rung and the standing tiebreak would hand
  back develop, so a regression that skips rank one fails here rather than
  quietly passing on a coincidence.

repos:
  - name: copy-base
    default_branch: main
    branches:
      - name: main
        files:
          - path: README.md
            content: "# copy-base"
          - path: .gitignore
            content: |
              cache/
        commits:
          - message: "Initial commit"
      - name: develop
        from: main
    daft_yml: |
      copy:
        - cache/

steps:
  - name: Clone the repository
    run: daft clone --layout contained $REMOTE_COPY_BASE
    expect:
      exit_code: 0
      dirs_exist:
        - "$WORK_DIR/copy-base/main"

  - name: Build a cache in main that says where it came from
    # `set -e`: step bodies run under `bash -c` with no errexit, so without it
    # only the last command's status is reported.
    run: |
      set -e
      mkdir -p cache
      printf 'from-main\n' > cache/who.txt
      git check-ignore cache
    cwd: "$WORK_DIR/copy-base/main"
    expect:
      exit_code: 0

  - name: Check out develop, then give it a cache of its own
    run: |
      set -e
      daft go develop
      printf 'from-develop\n' > "$WORK_DIR/copy-base/develop/cache/who.txt"
    cwd: "$WORK_DIR/copy-base/main"
    expect:
      exit_code: 0
      file_contains:
        - path: "$WORK_DIR/copy-base/develop/cache/who.txt"
          content: "from-develop"

  - name: Start a branch from main WHILE STANDING IN develop
    run: daft start feat-base main 2>&1
    cwd: "$WORK_DIR/copy-base/develop"
    expect:
      exit_code: 0
      output_contains:
        - "Copied cache"
      files_exist:
        - "$WORK_DIR/copy-base/feat-base/cache/who.txt"

  - name: The cache came from main — the base named — not from develop
    run: "true"
    expect:
      exit_code: 0
      file_contains:
        - path: "$WORK_DIR/copy-base/feat-base/cache/who.txt"
          content: "from-main"
      file_not_contains:
        - path: "$WORK_DIR/copy-base/feat-base/cache/who.txt"
          content: "from-develop"

  - name: Neither existing worktree's cache was disturbed
    run: "true"
    expect:
      exit_code: 0
      file_contains:
        - path: "$WORK_DIR/copy-base/main/cache/who.txt"
          content: "from-main"
        - path: "$WORK_DIR/copy-base/develop/cache/who.txt"
          content: "from-develop"
