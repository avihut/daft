name: Activate creates the rc file and writes the shell-init line
description: >
  With no rc file in HOME, `daft activate --force` creates it and appends the
  eval line for the detected shell. Ported from test_activate.sh
  (activate_creates_config) — a fake HOME so the developer's real rc file is
  never touched.

steps:
  - name: Activate zsh into an empty HOME
    run: |
      set -e
      mkdir -p "$WORK_DIR/home"
      HOME="$WORK_DIR/home" SHELL=/bin/zsh daft activate --force 2>&1
    expect:
      exit_code: 0
      files_exist:
        - "$WORK_DIR/home/.zshrc"
      file_contains:
        - path: "$WORK_DIR/home/.zshrc"
          content: "daft shell-init zsh"
